<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物資管理系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-size: 16px; }
        .nav-pills .nav-link.active { background-color: #198754; }
        .btn-lg { padding: 12px 20px; font-size: 1.1rem; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        .item-row { background: #fdfdfd; border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- 密碼驗證區塊 -->
<div id="loginSection" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h4 class="text-success fw-bold mb-3">🌱 物資管理系統登入</h4>
                <p class="text-muted small mb-4">請輸入通行密碼以存取權限功能</p>
                <div class="mb-3">
                    <input type="password" id="accessCode" class="form-control form-control-lg text-center" placeholder="請輸入4位數密碼">
                </div>
                <button class="btn btn-success btn-lg w-100" onclick="verifyPassword()">登入系統</button>
            </div>
        </div>
    </div>
</div>

<!-- 主要系統區域 -->
<div id="mainSystem" class="container py-3 hidden">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-success fw-bold m-0">🌱 物資管理系統</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">登出</button>
    </div>

    <!-- 功能導覽頁籤 -->
    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="pills-tab" role="tablist">
        <li class="nav-item" id="tab-in-li" role="presentation">
            <button class="nav-link active fw-bold" id="tab-in-btn" data-bs-toggle="pill" data-bs-target="#tab-in" type="button">進貨登錄</button>
        </li>
        <li class="nav-item" id="tab-out-li" role="presentation">
            <button class="nav-link fw-bold" id="tab-out-btn" data-bs-toggle="pill" data-bs-target="#tab-out" type="button">出貨登錄</button>
        </li>
        <li class="nav-item" id="tab-return-li" role="presentation">
            <button class="nav-link fw-bold text-danger" id="tab-return-btn" data-bs-toggle="pill" data-bs-target="#tab-return" type="button">退貨登錄</button>
        </li>
        <li class="nav-item" id="tab-search-li" role="presentation">
            <button class="nav-link fw-bold" id="tab-search-btn" data-bs-toggle="pill" data-bs-target="#tab-search" type="button" onclick="loadInventoryData()">查詢與修改</button>
        </li>
        <li class="nav-item" id="tab-report-li" role="presentation">
            <button class="nav-link fw-bold" id="tab-report-btn" data-bs-toggle="pill" data-bs-target="#tab-report" type="button" onclick="loadReport('inventory')">報表查詢</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <!-- 1. 進貨登錄 -->
        <div class="tab-pane fade show active" id="tab-in">
            <div class="card p-4">
                <h5 class="card-title text-success mb-3">📦 新增進貨資料</h5>
                <form id="inboundForm" onsubmit="submitInbound(event)">
                    <div class="mb-3">
                        <label class="form-label">進貨時間 (台灣時間)</label>
                        <input type="text" id="inTime" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">進貨單號 (自動預設，可修改)</label>
                        <input type="text" id="inNo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">收貨志工姓名</label>
                        <input type="text" id="inVolunteer" class="form-control" required placeholder="請輸入姓名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">廠商名稱</label>
                        <input type="text" id="inVendor" class="form-control" required placeholder="請輸入廠商名稱">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">物品品項</label>
                        <select id="inItemSelect" class="form-select mb-2" onchange="checkNewItemOption()" required></select>
                        <input type="text" id="inItemCustom" class="form-control hidden" placeholder="請輸入新物品名稱">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">箱數</label>
                            <input type="number" id="inBoxes" class="form-control" required min="1">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">總數</label>
                            <input type="number" id="inTotal" class="form-control" required min="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">備註欄位 1</label>
                        <input type="text" id="inNote1" class="form-control" placeholder="臨時備註 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">備註欄位 2</label>
                        <input type="text" id="inNote2" class="form-control" placeholder="臨時備註 2">
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg">確認送出進貨</button>
                </form>
            </div>
        </div>

        <!-- 2. 出貨登錄 -->
        <div class="tab-pane fade" id="tab-out">
            <div class="card p-4">
                <h5 class="card-title text-success mb-3">📤 領取/出貨登錄</h5>
                <form id="outboundForm" onsubmit="submitOutbound(event)">
                    <div class="mb-3">
                        <label class="form-label">領貨志工姓名</label>
                        <input type="text" id="outVolunteer" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">行動電話號碼</label>
                        <input type="tel" id="outPhone" class="form-control" required placeholder="09xxxxxxxx">
                    </div>

                    <div class="mb-3 p-3 bg-light border rounded">
                        <label class="form-label fw-bold text-success">🎁 快速帶入常用組合套組 (一袋全選)</label>
                        <button type="button" class="btn btn-outline-success btn-sm w-100 mb-2" onclick="loadPackageBag('outboundItemsContainer')">載入標準貴賓福慧袋 (包含9樣品項，數量皆為1)</button>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold m-0">領取物資明細</label>
                            <button type="button" class="btn btn-sm btn-success" onclick="addItemRow('outboundItemsContainer')">＋ 新增品項</button>
                        </div>
                        <div id="outboundItemsContainer"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">用途說明</label>
                        <input type="text" id="outPurpose" class="form-control" required placeholder="例：貴賓室發放">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">選擇場次</label>
                        <select id="outSession" class="form-select" required>
                            <option value="">請選擇場次</option>
                            <option value="第1場">第1場</option><option value="第2場">第2場</option>
                            <option value="第3場">第3場</option><option value="第4場">第4場</option>
                            <option value="第5場">第5場</option><option value="第6場">第6場</option>
                            <option value="第7場">第7場</option><option value="第8場">第8場</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">包廂號</label>
                        <div class="d-flex flex-wrap gap-2 mb-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S01')">S01</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S06')">S06</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S07')">S07</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S08')">S08</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S10')">S10</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S11')">S11</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'S18')">S18</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', '沙發區')">沙發區</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('outBoxNo', 'L2 新聞休息')">L2 新聞休息</button>
                        </div>
                        <input type="text" id="outBoxNo" class="form-control" placeholder="若無上述選項請自行填寫">
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg">確認送出出貨</button>
                </form>
            </div>
        </div>

        <!-- 3. 退貨登錄 -->
        <div class="tab-pane fade" id="tab-return">
            <div class="card p-4">
                <h5 class="card-title text-danger mb-3">🔄 退貨 / 歸還登錄</h5>
                <form id="returnForm" onsubmit="submitReturn(event)">
                    <div class="mb-3">
                        <label class="form-label">退貨/歸還志工姓名</label>
                        <input type="text" id="retVolunteer" class="form-control" required placeholder="請輸入姓名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">行動電話號碼</label>
                        <input type="tel" id="retPhone" class="form-control" required placeholder="09xxxxxxxx">
                    </div>

                    <div class="mb-3 p-3 bg-light border rounded">
                        <label class="form-label fw-bold text-danger">🎁 快速帶入常用組合套組 (整袋歸還)</label>
                        <button type="button" class="btn btn-outline-danger btn-sm w-100 mb-2" onclick="loadPackageBag('returnItemsContainer')">載入標準貴賓福慧袋 (包含9樣品項，數量皆為1)</button>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold m-0">退回物資明細 (支援個別歸還)</label>
                            <button type="button" class="btn btn-sm btn-danger" onclick="addItemRow('returnItemsContainer')">＋ 新增品項</button>
                        </div>
                        <div id="returnItemsContainer"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">退貨/歸還原因說明</label>
                        <input type="text" id="retPurpose" class="form-control" required value="貴賓臨時未出席退回" placeholder="例：貴賓臨時未出席退回">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">選擇場次</label>
                        <select id="retSession" class="form-select" required>
                            <option value="">請選擇場次</option>
                            <option value="第1場">第1場</option><option value="第2場">第2場</option>
                            <option value="第3場">第3場</option><option value="第4場">第4場</option>
                            <option value="第5場">第5場</option><option value="第6場">第6場</option>
                            <option value="第7場">第7場</option><option value="第8場">第8場</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">包廂號</label>
                        <div class="d-flex flex-wrap gap-2 mb-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S01')">S01</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S06')">S06</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S07')">S07</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S08')">S08</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S10')">S10</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S11')">S11</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'S18')">S18</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', '沙發區')">沙發區</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setBox('retBoxNo', 'L2 新聞休息')">L2 新聞休息</button>
                        </div>
                        <input type="text" id="retBoxNo" class="form-control" placeholder="若無上述選項請自行填寫">
                    </div>
                    <button type="submit" class="btn btn-danger w-100 btn-lg">確認送出退貨歸還</button>
                </form>
            </div>
        </div>

        <!-- 4. 查詢與修改 -->
        <div class="tab-pane fade" id="tab-search">
            <div class="card p-4">
                <h5 class="card-title text-success mb-3">🔍 資料查詢與修改</h5>
                <input type="text" id="searchInput" class="form-control mb-3" placeholder="輸入單號、品項或志工關鍵字搜尋..." onkeyup="filterTable()">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle" style="font-size: 0.9rem;">
                        <thead class="table-success">
                            <tr>
                                <th>單號</th><th>品項</th><th>箱數</th><th>總數</th><th>庫存</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 5. 報表查詢 -->
        <div class="tab-pane fade" id="tab-report">
            <div class="card p-4">
                <h5 class="card-title text-success mb-3">📊 統計報表與即時庫存</h5>
                <div class="btn-group w-100 mb-3" role="group">
                    <input type="radio" class="btn-check" name="reportType" id="rep1" checked onclick="loadReport('inventory')">
                    <label class="btn btn-outline-success" for="rep1">即時庫存</label>
                    <input type="radio" class="btn-check" name="reportType" id="rep2" onclick="loadReport('inbound')">
                    <label class="btn btn-outline-success" for="rep2">進貨</label>
                    <input type="radio" class="btn-check" name="reportType" id="rep3" onclick="loadReport('outbound')">
                    <label class="btn btn-outline-success" for="rep3">出貨</label>
                    <input type="radio" class="btn-check" name="reportType" id="rep4" onclick="loadReport('return')">
                    <label class="btn btn-outline-danger" for="rep4">退貨</label>
                </div>
                <div id="reportContainer" class="table-responsive"></div>
            </div>
        </div>

    </div>
</div>

<!-- 修改資料 Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">修改進貨資料</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editRowIndex">
        <div class="mb-3"><label class="form-label">收貨志工</label><input type="text" id="editVolunteer" class="form-control"></div>
        <div class="mb-3"><label class="form-label">廠商名稱</label><input type="text" id="editVendor" class="form-control"></div>
        <div class="mb-3"><label class="form-label">箱數</label><input type="number" id="editBoxes" class="form-control"></div>
        <div class="mb-3"><label class="form-label">總數</label><input type="number" id="editTotal" class="form-control"></div>
        <div class="mb-3"><label class="form-label">備註 1</label><input type="text" id="editNote1" class="form-control"></div>
        <div class="mb-3"><label class="form-label">備註 2</label><input type="text" id="editNote2" class="form-control"></div>
        <div class="mb-3"><label class="form-label text-danger fw-bold">異動原因說明 (必填)</label><input type="text" id="editReason" class="form-control" required placeholder="請說明修改原因"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success" onclick="saveEditedData()">儲存修改</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    // 1. 從 Google CDN 引入 Firebase 模組
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. 你的 Firebase 設定
    const firebaseConfig = {
        apiKey: "AIzaSyCT9ZQRSCqa9SuOVZFVPSPiBnp5ExfJYc",
        authDomain: "public-material-managessystem.firebaseapp.com",
        projectId: "public-material-managessystem",
        storageBucket: "public-material-managessystem.firebasestorage.app",
        messagingSenderId: "535281304176",
        appId: "1:535281304176:web:061808d24415fb71c82ab5",
        measurementId: "G-BXYNLN7YLF"
    };

    // 3. 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    console.log("Firebase 連線初始化完成！");

    let globalItemsList = [];
    const STANDARD_BAG_ITEMS = [
        "無量義法髓頌(書)",
        "五毛錢(吊飾)",
        "一甲子紀念別針",
        "影響力(書)",
        "50周年紀念水瓶",
        "10月月刊",
        "福慧珍粥",
        "簡餐（漢堡）",
        "60周年袋"
    ];

    function verifyPassword() {
        const pwd = document.getElementById('accessCode').value.trim();
        if (pwd === '1004') {
            showSystem(['tab-in-li', 'tab-out-li', 'tab-return-li', 'tab-search-li', 'tab-report-li']);
        } else if (pwd === '1003') {
            showSystem(['tab-in-li', 'tab-out-li', 'tab-return-li', 'tab-search-li']);
        } else if (pwd === '1002') {
            showSystem(['tab-in-li', 'tab-out-li', 'tab-return-li']);
        } else {
            alert('密碼不正確，請重新輸入！');
        }
    }

    function showSystem(allowedTabs) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainSystem').classList.remove('hidden');

        ['tab-in-li', 'tab-out-li', 'tab-return-li', 'tab-search-li', 'tab-report-li'].forEach(tabId => {
            const el = document.getElementById(tabId);
            if (el) {
                if (allowedTabs.includes(tabId)) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            }
        });

        updateTaiwanTime();
        if (!window.timeTimer) {
            window.timeTimer = setInterval(updateTaiwanTime, 1000);
        }

        fetchAutoInboundNo();
        fetchItems();
    }

    function logout() {
        document.getElementById('accessCode').value = '';
        document.getElementById('mainSystem').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }

    function updateTaiwanTime() {
        const now = new Date();
        const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('inTime').value = new Intl.DateTimeFormat('zh-TW', options).format(now);
    }

    function fetchAutoInboundNo() {
        if(document.getElementById('inNo')) {
            const now = new Date();
            const dateStr = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
            document.getElementById('inNo').value = dateStr + '-001';
        }
    }

    function fetchItems() {
        globalItemsList = STANDARD_BAG_ITEMS;
        let inSelect = document.getElementById('inItemSelect');
        if (inSelect) {
            inSelect.innerHTML = '<option value="">-- 請選擇物品品項 --</option>';
            globalItemsList.forEach(item => {
                inSelect.innerHTML += `<option value="${item}">${item}</option>`;
            });
            inSelect.innerHTML += '<option value="__NEW__">＋ 新增其他品項...</option>';
        }

        let outContainer = document.getElementById('outboundItemsContainer');
        if (outContainer && outContainer.children.length === 0) {
            addItemRow('outboundItemsContainer');
        }
        let retContainer = document.getElementById('returnItemsContainer');
        if (retContainer && retContainer.children.length === 0) {
            addItemRow('returnItemsContainer');
        }
    }

    function addItemRow(containerId, selectedItem = "", qty = 1) {
        let container = document.getElementById(containerId);
        if (!container) return;
        let rowId = containerId + '_' + Date.now() + Math.random().toString(36).substr(2, 5);
        
        let optionsHtml = '<option value="">-- 選擇物資 --</option>';
        globalItemsList.forEach(item => {
            let selected = (item === selectedItem) ? 'selected' : '';
            optionsHtml += `<option value="${item}" ${selected}>${item}</option>`;
        });
        optionsHtml += '<option value="__NEW__">＋ 自訂新增品項</option>';

        let div = document.createElement('div');
        div.className = 'item-row';
        div.id = rowId;
        div.innerHTML = `
            <div class="row g-2 align-items-center">
                <div class="col-7">
                    <select class="form-select item-select" onchange="checkRowCustomItem('${rowId}')" required>
                        ${optionsHtml}
                    </select>
                    <input type="text" class="form-control mt-1 item-custom hidden" placeholder="輸入自訂品項名稱">
                </div>
                <div class="col-3">
                    <input type="number" class="form-control item-qty" value="${qty}" min="1" required placeholder="數量">
                </div>
                <div class="col-2 text-end">
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeRow('${rowId}', '${containerId}')">✕</button>
                </div>
            </div>
        `;
        container.appendChild(div);
    }

    function removeRow(rowId, containerId) {
        let container = document.getElementById(containerId);
        if (container && container.children.length > 1) {
            document.getElementById(rowId).remove();
        } else {
            alert('至少需保留一項明細！');
        }
    }

    function checkRowCustomItem(rowId) {
        let row = document.getElementById(rowId);
        let select = row.querySelector('.item-select');
        let customInput = row.querySelector('.item-custom');
        if (select.value === '__NEW__') {
            customInput.classList.remove('hidden');
            customInput.required = true;
        } else {
            customInput.classList.add('hidden');
            customInput.required = false;
        }
    }

    function loadPackageBag(containerId) {
        let container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        STANDARD_BAG_ITEMS.forEach(item => {
            addItemRow(containerId, item, 1);
        });
    }

    function checkNewItemOption() {
        let val = document.getElementById('inItemSelect').value;
        let customInput = document.getElementById('inItemCustom');
        if (val === '__NEW__') {
            customInput.classList.remove('hidden');
            customInput.required = true;
        } else {
            customInput.classList.add('hidden');
            customInput.required = false;
        }
    }

    function setBox(elementId, val) {
        document.getElementById(elementId).value = val;
    }

    // 📦 送出進貨（直接寫入 Firebase Firestore）
    async function submitInbound(e) {
        e.preventDefault();
        let selectVal = document.getElementById('inItemSelect').value;
        let finalItem = (selectVal === '__NEW__') ? document.getElementById('inItemCustom').value.trim() : selectVal;

        try {
            await addDoc(collection(window.db, "inventory"), {
                inboundNo: document.getElementById('inNo').value,
                time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
                volunteer: document.getElementById('inVolunteer').value,
                vendor: document.getElementById('inVendor').value,
                item: finalItem,
                boxes: Number(document.getElementById('inBoxes').value),
                total: Number(document.getElementById('inTotal').value),
                stock: Number(document.getElementById('inTotal').value),
                note1: document.getElementById('inNote1').value || '',
                note2: document.getElementById('inNote2').value || ''
            });

            alert('📦 進貨登錄成功，已直接存入 Firebase！');
            document.getElementById('inboundForm').reset();
            document.getElementById('inItemCustom').classList.add('hidden');
            fetchAutoInboundNo();
        } catch (err) {
            alert('❌ 寫入 Firebase 失敗（請確認權限規則是否已發布）：' + err.message);
        }
    }

    function submitOutbound(e) {
        e.preventDefault();
        alert('出貨功能準備對接 Firebase！');
    }

    function submitReturn(e) {
        e.preventDefault();
        alert('退貨功能準備對接 Firebase！');
    }

    // 🔍 從 Firebase 讀取查詢資料
    let allInventory = [];
    async function loadInventoryData() {
        try {
            const querySnapshot = await getDocs(collection(window.db, "inventory"));
            allInventory = [];
            
            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                allInventory.push({
                    id: docSnap.id,
                    inboundNo: data.inboundNo || '',
                    item: data.item || '',
                    boxes: data.boxes || 0,
                    total: data.total || 0,
                    stock: data.stock !== undefined ? data.stock : data.total,
                    volunteer: data.volunteer || '',
                    vendor: data.vendor || '',
                    time: data.time || '',
                    note1: data.note1 || '',
                    note2: data.note2 || ''
                });
            });

            renderTable(allInventory);
        } catch (err) {
            console.error("讀取 Firebase 失敗:", err);
            alert('❌ 讀取資料失敗：' + err.message);
        }
    }

    function renderTable(data) {
        let tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">目前尚無進貨資料</td></tr>';
            return;
        }
        data.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${row.inboundNo}</td>
                    <td>${row.item}</td>
                    <td>${row.boxes}</td>
                    <td>${row.total}</td>
                    <td><span class="badge bg-success">${row.stock}</span></td>
                    <td><button class="btn btn-sm btn-outline-primary" onclick="alert('修改功能建置中')">修改</button></td>
                </tr>
            `;
        });
    }

    function filterTable() {
        let keyword = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allInventory.filter(r => 
            String(r.inboundNo).toLowerCase().includes(keyword) || 
            String(r.item).toLowerCase().includes(keyword) || 
            String(r.volunteer).toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    // 📊 報表查詢（自動串接 Firestore 資料）
    async function loadReport(type) {
        try {
            // 確保每次看報表時都有最新資料
            if (allInventory.length === 0) {
                const querySnapshot = await getDocs(collection(window.db, "inventory"));
                allInventory = [];
                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    allInventory.push({
                        id: docSnap.id,
                        inboundNo: data.inboundNo || '',
                        item: data.item || '',
                        boxes: data.boxes || 0,
                        total: data.total || 0,
                        stock: data.stock !== undefined ? data.stock : data.total,
                        volunteer: data.volunteer || '',
                        vendor: data.vendor || '',
                        time: data.time || ''
                    });
                });
            }

            let container = document.getElementById('reportContainer');
            if (type === 'inventory') {
                // 彙整即時庫存
                let summary = {};
                allInventory.forEach(r => {
                    if (!summary[r.item]) summary[r.item] = 0;
                    summary[r.item] += Number(r.stock);
                });

                let html = `<table class="table table-bordered table-striped"><thead class="table-success"><tr><th>品項</th><th>即時總庫存</th></tr></thead><tbody>`;
                for (let [item, stock] of Object.entries(summary)) {
                    html += `<tr><td>${item}</td><td class="fw-bold text-success">${stock}</td></tr>`;
                }
                if (Object.keys(summary).length === 0) html += `<tr><td colspan="2" class="text-center text-muted">目前尚無庫存資料</td></tr>`;
                html += `</tbody></table>`;
                container.innerHTML = html;
            } else if (type === 'inbound') {
                let html = `<table class="table table-bordered table-striped" style="font-size:0.85rem;"><thead class="table-success"><tr><th>時間</th><th>單號</th><th>品項</th><th>箱數</th><th>總數</th></tr></thead><tbody>`;
                allInventory.forEach(r => {
                    html += `<tr><td>${r.time}</td><td>${r.inboundNo}</td><td>${r.item}</td><td>${r.boxes}</td><td>${r.total}</td></tr>`;
                });
                if (allInventory.length === 0) html += `<tr><td colspan="5" class="text-center text-muted">目前尚無進貨紀錄</td></tr>`;
                html += `</tbody></table>`;
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="text-center text-muted py-3">此報表功能建置中</div>`;
            }
        } catch (err) {
            console.error("載入報表失敗:", err);
        }
    }

    function saveEditedData() {}

    // 綁定全域函數供 HTML 呼叫
    window.verifyPassword = verifyPassword;
    window.logout = logout;
    window.checkNewItemOption = checkNewItemOption;
    window.addItemRow = addItemRow;
    window.removeRow = removeRow;
    window.checkRowCustomItem = checkRowCustomItem;
    window.loadPackageBag = loadPackageBag;
    window.setBox = setBox;
    window.submitInbound = submitInbound;
    window.submitOutbound = submitOutbound;
    window.submitReturn = submitReturn;
    window.loadInventoryData = loadInventoryData;
    window.filterTable = filterTable;
    window.loadReport = loadReport;
    window.saveEditedData = saveEditedData;
</script>
</body>
</html>
